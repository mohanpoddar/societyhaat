
steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/society-haat-api', './backend']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/society-haat-api']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: ['run', 'deploy', 'society-haat-api', '--image', 'gcr.io/$PROJECT_ID/society-haat-api', '--region', 'asia-south1', '--allow-unauthenticated', '--port', '8080']
